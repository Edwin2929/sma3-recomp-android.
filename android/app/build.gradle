plugins { id 'com.android.application' }
ext.gbaGame = [
    applicationId: 'org.sma3.recomp.experimental',
    versionCode: 12,
    versionName: '0.10.1-panorama-fix-experimental',
    title: 'SMA3 Recomp experimental',
    romSha1: ['7352d2bd064d9ebaec579e264228aa21c7345b80'],
    romSize: 4194304,
    romFile: 'sma3-usa.gba',
    variant: 'sma3-usa',
    gameToml: file('../../runtime.toml'),
    gameRoot: file('../..'),
    engineRoot: file('../../../gbarecomp'),
    biosRequired: true,
    orientation: 'any',
    payloadVersion: '0.10.1',
    nativeJobs: 2,
    debugAbis: ['arm64-v8a'],
    cmakeArguments: ['-DSMA3_PANORAMA=ON'],
    setupNote: 'Experimental. Optional panoramic view; unsupported scenes keep the original view.'
]
def nativeArchive = file('../../native-cache/arm64-v8a/libgbarecomp_game.a')
if (nativeArchive.isFile()) {
    gbaGame.cmakeArguments += ["-DSMA3_PREBUILT_GAME=${nativeArchive.absolutePath}"]
}
apply from: new File(gbaGame.engineRoot, 'platform/android/gbarecomp-app.gradle')

android {
    buildToolsVersion "35.0.0"
    signingConfigs {
        debug {
            storeFile rootProject.file('debug-development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

// Keep the Android shell customizations with this project checkpoint.
android.sourceSets.main.java.srcDirs = [
    new File(gbaGame.engineRoot, 'platform/android/third_party/SDL/android-project/app/src/main/java'),
    file('../java')
]

android.sourceSets.main.manifest.srcFile file('../AndroidManifest.xml')



