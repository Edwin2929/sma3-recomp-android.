plugins { id 'com.android.application' }
ext.gbaGame = [
    applicationId: 'org.sma3.recomp.experimental',
    versionCode: 16,
    versionName: '0.10.5-beta',
    title: 'SMA3 Recomp experimental',
    romSha1: ['7352d2bd064d9ebaec579e264228aa21c7345b80'],
    romSize: 4194304,
    romFile: 'sma3-usa.gba',
    variant: 'sma3-usa',
    gameToml: file('../../runtime.toml'),
    gameRoot: file('../..'),
    engineRoot: file('../../../gbarecomp'),
    biosRequired: true,
    orientation: 'any',
    payloadVersion: '0.10.5',
    nativeJobs: 2,
    debugAbis: ['arm64-v8a'],
    cmakeArguments: ['-DSMA3_PANORAMA=ON'],
    setupNote: 'Panorámica (beta): fase temprana de desarrollo; puede contener errores visuales y escenas sin cobertura.'
]
def nativeArchive = file('../../native-cache/arm64-v8a/libgbarecomp_game.a')
if (nativeArchive.isFile()) {
    gbaGame.cmakeArguments += ["-DSMA3_PREBUILT_GAME=${nativeArchive.absolutePath}"]
}
apply from: new File(gbaGame.engineRoot, 'platform/android/gbarecomp-app.gradle')

android {
    buildToolsVersion "35.0.0"
    signingConfigs {
        debug {
            storeFile rootProject.file('debug-development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

// Keep the Android shell customizations with this project checkpoint.
android.sourceSets.main.java.srcDirs = [
    new File(gbaGame.engineRoot, 'platform/android/third_party/SDL/android-project/app/src/main/java'),
    file('../java')
]

android.sourceSets.main.manifest.srcFile file('../AndroidManifest.xml')

// Generate the importable example from its reviewed text sources. Keep it
// outside payload/: the user installs it explicitly through the Mods menu.
def modExampleAssets = layout.buildDirectory.dir('generated/sma3-mod-assets')
def modExampleArchive = layout.buildDirectory.file('generated/sma3-mod-package/tono-calido.gbamod')
def packageColorExample = tasks.register('packageSma3ColorExample', Exec) {
    inputs.file(file('../../tools/package_color_mod.py'))
    inputs.dir(file('../../mods/examples/tono-calido'))
    outputs.file(modExampleArchive)
    commandLine 'python3', file('../../tools/package_color_mod.py').absolutePath,
        file('../../mods/examples/tono-calido').absolutePath,
        modExampleArchive.get().asFile.absolutePath,
        '--replace'
}
def stageColorExample = tasks.register('stageSma3ColorExampleAssets', Sync) {
    dependsOn(packageColorExample)
    from(modExampleArchive) { into 'mod-examples' }
    into(modExampleAssets)
    // This tiny staging directory must contain only the one reviewed archive,
    // even if an unrelated file was left there by an earlier local build.
    outputs.upToDateWhen { false }
}
android.sourceSets.main.assets.srcDir(modExampleAssets)
tasks.named('preBuild').configure { dependsOn(stageColorExample) }



